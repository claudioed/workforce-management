{{- if and .Values.database.url (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workforce-management.databaseSecretName" . }}
  labels:
    {{- include "workforce-management.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
{{- if not .Values.auth.existingSecret }}
{{- if or .Values.auth.readKey .Values.auth.readWriteKey .Values.fulfillmentExecution.apiKey .Values.laborPerformance.apiKey }}
---
# REST identity keys (ADR-0017 / fleet ADR 0005). Each entry is rendered only
# when its value is non-empty; the Deployments reference every key as
# optional so a partially-populated Secret still schedules the pod.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workforce-management.authSecretName" . }}
  labels:
    {{- include "workforce-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
type: Opaque
stringData:
  {{- with .Values.auth.readKey }}
  # Bearer key granting the read scope on this service's REST surface.
  API_READ_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.readWriteKey }}
  # Bearer key granting the read-write scope on this service's REST surface.
  API_READWRITE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.fulfillmentExecution.apiKey }}
  # Bearer this service presents to fulfillment-execution.
  FULFILLMENT_EXECUTION_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.laborPerformance.apiKey }}
  # Bearer this service presents to labor-performance.
  LABOR_PERFORMANCE_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
