{{- if .Values.mcp.enabled }}
{{- /*
REPORTS_BASE_URL: explicit value wins; otherwise, when the analytics report
part is deployed by this same release, point at its in-cluster Service so the
curated get_workforce_labor_report tool works out of the box.
*/ -}}
{{- $reportsBaseURL := .Values.mcp.reportsBaseUrl -}}
{{- if and (not $reportsBaseURL) .Values.analytics.enabled -}}
{{- $reportsBaseURL = printf "http://%s.%s.svc.cluster.local:%v" (include "workforce-management.reportsFullname" .) .Release.Namespace .Values.analytics.reports.service.port -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workforce-management.mcpFullname" . }}
  labels:
    {{- include "workforce-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "workforce-management.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      annotations:
        checksum/mcp-secret: {{ include (print $.Template.BasePath "/mcp-secret.yaml") . | sha256sum }}
      labels:
        {{- include "workforce-management.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "workforce-management.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/mcp"]
          ports:
            - name: http
              containerPort: {{ .Values.mcp.service.targetPort }}
              protocol: TCP
          env:
            - name: MCP_ADDR
              value: {{ .Values.mcp.httpAddr | quote }}
            # The MCP server runs the SAME use cases over the SAME OLTP database
            # as cmd/workforce, so it reads the same DATABASE_URL secret.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "workforce-management.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            - name: MIGRATIONS_PATH
              value: {{ .Values.config.migrationsPath | quote }}
            - name: MAX_HOURS_PER_SHIFT
              value: {{ .Values.config.maxHoursPerShift | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # Static bearer keys (ADR-0008). Missing keys mean the server
            # rejects every request — never "open to everyone".
            - name: MCP_READ_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "workforce-management.mcpSecretName" . }}
                  key: MCP_READ_KEY
                  optional: true
            - name: MCP_READWRITE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "workforce-management.mcpSecretName" . }}
                  key: MCP_READWRITE_KEY
                  optional: true
            {{- if $reportsBaseURL }}
            - name: REPORTS_BASE_URL
              value: {{ $reportsBaseURL | quote }}
            {{- end }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "workforce-management-mcp"
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- end }}
          # GET /healthz is served unauthenticated by cmd/mcp specifically so
          # probes (which carry no bearer key) can reach it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
