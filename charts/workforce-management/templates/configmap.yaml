apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "workforce-management.fullname" . }}
  labels:
    {{- include "workforce-management.labels" . | nindent 4 }}
data:
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  EVENT_PUBLISHER: {{ .Values.config.eventPublisher | quote }}
  # REST identity mode (ADR-0017 / fleet ADR 0005): enforce | log | off.
  AUTH_MODE: {{ .Values.auth.mode | quote }}
  {{- if .Values.kafka.enabled }}
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  {{- end }}
