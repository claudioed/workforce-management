{{- if and .Values.mcp.enabled (not .Values.mcp.existingSecret) }}
{{- if or .Values.mcp.readKey .Values.mcp.readWriteKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workforce-management.mcpSecretName" . }}
  labels:
    {{- include "workforce-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
type: Opaque
stringData:
  {{- with .Values.mcp.readKey }}
  # Bearer key granting read scope.
  MCP_READ_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.mcp.readWriteKey }}
  # Bearer key granting read-write scope.
  MCP_READWRITE_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
