# Default values for workforce-management.

replicaCount: 1

image:
  repository: workforce-management
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: workforce-management.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API HTTPRoute: an additive, disabled-by-default alternative to the
# Ingress above. warehouse-infra's Kong Ingress Controller routes HTTPRoute
# traffic once its GatewayClass carries the konghq.com/gatewayclass-unmanaged
# annotation (verified live in the fulfillment-execution pilot). Flipping a
# service from Ingress to HTTPRoute is then just enabling this block and
# disabling ingress.enabled above — both can also coexist during migration.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

config:
  httpAddr: ":8080"
  eventPublisher: "log"   # "log" or "kafka"
  migrationsPath: "migrations"
  maxHoursPerShift: "8.0"

# UNLIKE THE OTHER THREE SERVICES: this binary calls requireEnv("DATABASE_URL")
# and log.Fatalf's (crash-loops) if it's unset — there is no in-memory
# fallback. You MUST set database.url or database.existingSecret; the chart
# refuses to render (a clear `helm install`-time error) rather than let you
# ship a crash-looping pod, matching the binary's own fail-fast design.
database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

kafka:
  enabled: false
  brokers: "kafka:9092"

# --- REST identity (ADR-0017; fleet decision: warehouse-ops-agent ADR 0005) ---
# Static bearer keys with read / read-write scopes guard every route except
# /healthz on both the OLTP service and the reports reader. mode is written
# to the ConfigMap as AUTH_MODE:
#   enforce  reject unauthenticated / under-scoped requests (401/403)
#   log      let everything through but log "auth: would-reject" (rollout gate)
#   off      middleware disabled
# The keys are rendered into the chart Secret as API_READ_KEY /
# API_READWRITE_KEY only when non-empty; point existingSecret at a Secret
# carrying those keys to manage them out of band. NOTE: the binaries default
# AUTH_MODE to "off" (with a WARN) when NO key is configured, whatever mode
# says — so a release with neither key nor existingSecret stays open.
auth:
  mode: "enforce"
  readKey: ""
  readWriteKey: ""
  existingSecret: ""

# Bearer presented to fulfillment-execution by the installed-capacity client
# (FULFILLMENT_EXECUTION_API_KEY). Empty = no Authorization header.
fulfillmentExecution:
  apiKey: ""

# Bearer presented to labor-performance by the measured-rate client
# (LABOR_PERFORMANCE_API_KEY). Empty = no Authorization header.
laborPerformance:
  apiKey: ""

# OpenTelemetry. Traces and metrics are PUSHED over OTLP/gRPC to a Collector;
# there is no scrape endpoint on the pod. Export is non-blocking, so pointing
# this at an unreachable Collector degrades to "telemetry dropped", never to a
# crash-looping or hanging pod.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "workforce-management"

# deployment.environment.name resource attribute on every span and metric.
environment: "local"

# Log level for the JSON slog handler: debug|info|warn|error.
logLevel: "info"

extraEnv: []

# ---------------------------------------------------------------------------
# Process-path catalogue (ADR-0013 here / ADR-0017 in fulfillment-execution):
# a boot-time-required file this binary reads via PATH_CATALOGUE_FILE.
# warehouse-infra owns the canonical content (config/process-paths/*.yaml is
# the fleet's published-language source of truth, shared verbatim with
# fulfillment-execution and wes-work-planning) -- this chart just knows how
# to mount whatever content it's given.
# ---------------------------------------------------------------------------
pathCatalogue:
  enabled: true
  mountPath: "/etc/workforce-management"
  # Raw YAML content of the catalogue file (e.g. via --set-file or a
  # values.yaml `content: |` block). Ignored when existingConfigMap is set.
  content: ""
  # Name of a pre-existing ConfigMap with a "process-paths.yaml" data key.
  # When set, content above is ignored and no ConfigMap is created here.
  existingConfigMap: ""

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}

# --- analytics data product (ADR-0010) ---
# The per-service "Labor Utilization & Staffing" report: a separate
# analytics topic, a writer (projector) and a read-only reader (reports),
# backed by a separate analytical database. Disabled by default so existing
# releases are unaffected; set analytics.enabled=true to deploy the two extra
# processes.
analytics:
  enabled: false
  # Directory (inside the image) of the analytical *.up.sql migrations the
  # projector applies on start.
  migrationsPath: "migrations/analytics"
  database:
    # The projector's read-write analytical DSN.
    projectorUrl: ""
    # The reader's DSN — a read-only role where possible; falls back to the
    # projector DSN when empty (local/dev).
    reportsUrl: ""
    # Name of an existing Secret with ANALYTICS_DATABASE_URL and
    # ANALYTICS_READER_DATABASE_URL keys. Takes precedence over the URLs above.
    existingSecret: ""
  projector:
    replicaCount: 1
    adminAddr: ":8091"
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  reports:
    replicaCount: 1
    httpAddr: ":8092"
    service:
      type: ClusterIP
      port: 80
      targetPort: 8092
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# --- MCP server (ADR-0008) ---
# A second deployable (/app/mcp in the same image) exposing this context's
# use cases to AI clients over MCP Streamable HTTP. It runs the same use
# cases over the same OLTP database (DATABASE_URL from the database secret)
# and is guarded by static bearer keys. Disabled by default so existing
# releases are unaffected; set mcp.enabled=true and at least mcp.readKey (or
# mcp.existingSecret) to deploy it. Without any key the binary starts but
# rejects every request (fail closed).
mcp:
  enabled: false
  replicaCount: 1
  # MCP_ADDR the binary listens on; keep in sync with service.targetPort.
  httpAddr: ":8090"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Bearer key granting read scope (MCP_READ_KEY).
  readKey: ""
  # Bearer key granting read-write scope (MCP_READWRITE_KEY); optional.
  readWriteKey: ""
  # Name of an existing Secret with MCP_READ_KEY and MCP_READWRITE_KEY keys.
  # Takes precedence over the keys above (no Secret is created here).
  existingSecret: ""
  # Base URL of the reports REST service the curated
  # get_workforce_labor_report tool calls (REPORTS_BASE_URL). When empty and
  # analytics.enabled is true, defaults to the in-cluster reports Service.
  # The tool is not registered when the resulting URL is empty.
  reportsBaseUrl: ""
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
